name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish the web app
        run: dotnet publish MagicKeywords.Web/MagicKeywords.Web.csproj -c Release -o out

      # Project sites live at https://<user>.github.io/<repo>/, so the base path must match the repo name.
      # (A repo named <user>.github.io is served from the root instead.)
      - name: Set base path and SPA fallback
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          sed -i "s|<base href=\"/\" />|<base href=\"$BASE\" />|" out/wwwroot/index.html
          grep -q "<base href=\"$BASE\" />" out/wwwroot/index.html
          cp out/wwwroot/index.html out/wwwroot/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
